server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Reverse-proxy API calls to the backend service (compose network hostname
    # "backend", overridable via BACKEND_HOST if the compose service is
    # renamed). The frontend build's VITE_API_BASE_URL should point at
    # "/api" in this containerized setup so requests hit this location block.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: any non-API, non-file route resolves to index.html so
    # client-side routing (react-router) handles it.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache immutable hashed build assets aggressively.
    location ~* \.(?:js|css|woff2?|ttf|svg|ico|png|jpg|jpeg|gif)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }
}
