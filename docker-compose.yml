services:
  db:
    image: mysql:8.0
    container_name: bankapp-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: bankapp
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-devRootPass123}
    ports:
      - "3306:3306"
    volumes:
      - bankapp-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-devRootPass123}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  bankapp-mysql-data:
    driver: local
